<!DOCTYPE html>
<html>
<head>
<title>Options</title>
<style>
body {
  margin:0;
  font-family:sans-serif;
  height:100vh;
  overflow:hidden;
}

body::before {
  content:"";
  position:absolute;
  width:100%; height:100%;
  background:url("backpro.jpeg") no-repeat center center/cover;
  filter: blur(6px);
  z-index:-2;
}

body::after {
  content:"";
  position:absolute;
  width:100%; height:100%;
  background: rgba(0,0,0,0.5);
  z-index:-1;
}

.container {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  background: rgba(255,255,255,0.1);
  padding:40px;
  border-radius:25px;
  text-align:center;
  width:420px;
  color:white;
  backdrop-filter: blur(12px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

h1 { margin-bottom:25px; font-size:26px; }

/* Existing Buttons */
button {
  width:100%;
  padding:16px;
  margin:10px 0;
  border-radius:35px;
  cursor:pointer;
  border:2px solid white;
  font-size:18px;
  transition:0.3s;
  background:transparent;
  color:white;
}

button:hover { transform:scale(1.03); background: rgba(255,255,255,0.1); }

/* AI CARD DESIGN (As requested) */
.ai-card {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 20px;
  margin-top: 15px;
  cursor: pointer;
  transition: 0.3s;
  display: block;
}

.ai-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }

.ai-icon { font-size: 30px; margin-bottom: 5px; }
h3 { margin: 5px 0; font-size: 18px; }
p { margin: 0; font-size: 13px; opacity: 0.9; }

</style>
</head>
<body>

<div class="container">
  <h1>What would you like to do?</h1>

  <button onclick="window.location.href='categories.html'">📝 Create Your Resume</button>

  <div class="ai-card" onclick="window.location.href='ai_chatbot.html'">
    <div class="ai-icon">✦</div>
    <h3>Create with AI</h3>
    <p>Chat with AI — it builds your resume for you</p>
  </div>
</div>

</body>
</html>
