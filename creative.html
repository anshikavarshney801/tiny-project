<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creative Templates</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

/* BACKGROUND */
body{
  height:100vh;
  background:url("backpro.jpeg") no-repeat center;
  background-size:cover;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* BLUR OVERLAY */
.overlay{
  position:absolute;
  width:100%;
  height:100%;
  backdrop-filter: blur(12px);
  background:rgba(0,0,0,0.5);
}


/* CONTAINER */
.container{
  position:relative;
  z-index:2;
  width:90%;
  max-width:1100px;
  text-align:center;
  color:white;
}

h1{
  margin-bottom:30px;
}

/* GRID */
.templates{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap:25px;
}

/* CARD */
.card{
  background: rgba(255,255,255,0.1);
  border-radius:15px;
  padding:15px;
  cursor:pointer;
  transition:0.3s;
  backdrop-filter: blur(8px);
}

.card:hover{
  transform: scale(1.05);
  background: rgba(255,255,255,0.25);
}

/* IMAGE */
.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:10px;
}

/* TEXT */
.card h3{
  margin-top:10px;
  font-weight:500;
}

/* BACK BUTTON */
.back-btn{
  position:absolute;
  top:20px;
  left:20px;
  background:rgba(255,255,255,0.2);
  border:none;
  padding:8px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.back-btn:hover{
  background:rgba(255,255,255,0.4);
}
</style>
</head>

<body>

<div class="overlay"></div>

<!-- BACK BUTTON -->
<button class="back-btn" onclick="goBack()">← Back</button>

<div class="container">

<h1>Creative Resume Templates</h1>

<div class="templates">

  <div class="card" onclick="selectTemplate('temp14c')">
    <img src="templates/temp14c.jpg.jpeg">
    <h3>Blue Splash</h3>
  </div>

  <div class="card" onclick="selectTemplate('temp8c')">
    <img src="templates/temp8c.webp">
    <h3>Creative Beige</h3>
  </div>

  <div class="card" onclick="selectTemplate('temp4c')">
    <img src="templates/temp4c.webp">
    <h3>Artistic Layout</h3>
  </div>

  <div class="card" onclick="selectTemplate('temp11c')">
    <img src="templates/temp11c.avif">
    <h3>Bold Design</h3>
  </div>

</div>

</div>

<script>
function selectTemplate(template){

  // 🔥 FINAL MAPPING (NO FORM CHANGE)
  let map = {
    "temp8c": "creative2",
    "temp14c": "creative1",
    "temp4c": "creative3",
    "temp11c": "creative4"
  };

  // SAME KEY jo form use karta hai
  localStorage.setItem("template", map[template]);

  // form open
  window.location.href = "form.html";
}
function goBack(){
  window.location.href = "categories.html";
}
</script>

</body>
</html>
