<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: "Segoe UI", sans-serif;
}

body{
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* CONTAINER */
.container{
display:flex;
height:100vh;
}

/* LEFT */
.left{
flex:1;
display:flex;
justify-content:center;
align-items:center;
}

.hero-img{
width:80%;
max-width:400px;
}

/* RIGHT */
.right{
flex:1;
background:#f6f8fb;
display:flex;
justify-content:center;
align-items:center;
border-top-left-radius:120px;
border-bottom-left-radius:120px;
}

/* LOGIN BOX */
.login-box{
width:320px;
}

.login-box h2{
margin-bottom:20px;
font-size:28px;
}

.login-box input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:25px;
border:1px solid #ddd;
outline:none;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:25px;
background: linear-gradient(135deg,#2c5364,#203a43,#0f2027);
color:white;
cursor:pointer;
}

/* GOOGLE BUTTON */
.google-btn{
width:50px;
height:50px;
border-radius:50%;
border:1px solid #ddd;
background:white;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
margin-top:15px;
cursor:pointer;
}

@media (max-width:768px){
.left{ display:none; }
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left">
  <img src="illustration.png" class="hero-img">
</div>

<!-- RIGHT -->
<div class="right">
<div class="login-box">

<h2>Login</h2>

<input id="email" type="email" placeholder="Enter your email">
<input id="password" type="password" placeholder="Enter password">
<input id="name" placeholder="Enter your name">


<button onclick="emailLogin()">Login</button>
<button onclick="registerUser()">Register</button>

<hr style="margin:15px 0">

<div class="google-btn" onclick="googleLogin()">
  <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="22">
</div>

</div>
</div>

</div>

<!-- 🔥 FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDi4lloKLUHJMYu6H2SIK8WuMvjBCUFkBo",
  authDomain: "resume-builder-1596f.firebaseapp.com",
  projectId: "resume-builder-1596f",
  storageBucket: "resume-builder-1596f.firebasestorage.app",
  messagingSenderId: "15581364627",
  appId: "1:15581364627:web:377f87d676fc54c5baa866"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// ✅ GOOGLE LOGIN
window.googleLogin = async function(){
  try {
    const provider = new GoogleAuthProvider();
    const result = await signInWithPopup(auth, provider);

    localStorage.setItem("user", JSON.stringify({
      name: result.user.displayName,
      email: result.user.email,
      image: result.user.photoURL   // ✅ FIX
    }));

    window.location.href = "dashboard.html";

  } catch(error){
    alert(error.message);
  }
};

// ✅ REGISTER
window.registerUser = async function(){
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Fill all fields");
    return;
  }
    localStorage.setItem("user", JSON.stringify({
    name: name,
    email: email
  }));
  

  try{
    await createUserWithEmailAndPassword(auth, email, password);
    alert("Registration Successful!");
  }
  catch(error){
    alert(error.message);
  }

  window.location.href = "dashboard.html";
};


// ✅ EMAIL LOGIN
window.emailLogin = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const name = document.getElementById("name").value;

  if (!email || !password) {
    alert("Fill all fields");
    return;
  }

  try{
    const result = await signInWithEmailAndPassword(auth, email, password);

    localStorage.setItem("user", JSON.stringify({
      name: name,
      email: result.user.email,
      image: "https://i.pravatar.cc/150"  // ✅ default image
    }));

    window.location.href = "dashboard.html";

  } catch(error){
    alert(error.message);
  }
};

</script>
<script>
const user = JSON.parse(localStorage.getItem("user"));

if(user){
  document.getElementById("username").innerText =
    user.name || "User";

  document.getElementById("useremail").innerText =
    user.email;
}
</script>
</body>
</html>
