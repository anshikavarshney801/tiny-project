<!DOCTYPE html>
<html>
<head>
<title>Settings</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

/* BODY */
body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
  color:white;
}

/* 🔥 BLURRED BACKGROUND */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background: url("backpro.jpeg") no-repeat center center;
  background-size: cover;
  filter: blur(10px);
  z-index:0;
}

/* DARK OVERLAY */
.bg::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
}

/* MAIN CARD */
.container{
  position:relative;
  z-index:1;
  width:450px;
  background: rgba(255,255,255,0.1);
  border-radius:20px;
  padding:30px;
  backdrop-filter: blur(15px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

/* TITLE */
h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
}

/* OPTIONS */
.option{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.option:last-child{
  border-bottom:none;
}

/* BUTTONS */
.btn{
  padding:6px 14px;
  border-radius:20px;
  border:none;
  cursor:pointer;
  font-size:13px;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.btn-light{
  background:white;
  color:#203a43;
}

.btn-danger{
  background:#ff4d4d;
  color:white;
}

/* TOGGLE SWITCH */
.switch {
  position: relative;
  width: 42px;
  height: 22px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  background-color: #555;
  border-radius: 20px;
  top:0; left:0; right:0; bottom:0;
  cursor:pointer;
  transition:0.3s;
}

.slider:before {
  content:"";
  position:absolute;
  height:18px;
  width:18px;
  left:2px;
  bottom:2px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}

input:checked + .slider {
  background:#4CAF50;
}

input:checked + .slider:before {
  transform: translateX(20px);
}

/* BACK BUTTON */
.back-btn{
  width:100%;
  margin-top:20px;
  padding:12px;
  border-radius:25px;
  border:none;
  background: linear-gradient(135deg,#2c5364,#203a43);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- 🔥 BACKGROUND -->
<div class="bg"></div>

<script>
const user = localStorage.getItem("user");
if(!user){
  window.location.href = "login_page.html";
}
</script>

<div class="container">

<h2>Settings ⚙️</h2>

<!-- Change Username -->
<div class="option">
  <span>Change Username</span>
  <button class="btn btn-light" onclick="changeName()">Edit</button>
</div>

<!-- Delete Account -->
<div class="option">
  <span style="color:#ff6b6b;">Delete Account</span>
  <button class="btn btn-danger" onclick="deleteAccount()">Delete</button>
</div>

<button class="back-btn" onclick="goBack()">Back to Dashboard</button>

</div>

<script>

// CHANGE NAME
function changeName(){
  let user = JSON.parse(localStorage.getItem("user"));
  let newName = prompt("Enter new name:");

  if(newName){
    user.name = newName;
    localStorage.setItem("user", JSON.stringify(user));
    alert("Name updated ✅");
  }
}

// DELETE ACCOUNT
function deleteAccount(){
  if(confirm("Are you sure you want to delete your account?")){
    localStorage.removeItem("user");
    window.location.href = "login_page.html";
  }
}

// BACK
function goBack(){
  window.location.href = "dashboard.html";
}

</script>

</body>
</html>
