<!DOCTYPE html>
<html>
<head>
<title>History</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins', sans-serif;
  background: linear-gradient(180deg, #0f172a, #1e3a8a);
  color:white;
}

/* HEADER */
.header{
  padding:20px;
  font-size:22px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

/* CONTAINER */
.container{
  padding:20px;
}

/* CARD */
.box{
  background: rgba(255,255,255,0.08);
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
  backdrop-filter: blur(10px);
  transition:0.3s;
}

.box:hover{
  background: rgba(255,255,255,0.15);
  transform: translateY(-2px);
}

.box small{
  opacity:0.7;
}

/* EMPTY TEXT */
.empty{
  text-align:center;
  opacity:0.6;
  margin-top:50px;
}

/* BUTTON */
button{
  margin:20px;
  padding:10px 20px;
  border:none;
  border-radius:25px;
  background: rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background: rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<div class="header">📜 History</div>

<div class="container" id="list"></div>
<div id="historyList"></div>

<div style="text-align:center;">
  <button onclick="goBack()">⬅ Back to Dashboard</button>
</div>

<script>

// check login
const user = localStorage.getItem("user");
if(!user){
  window.location.href = "login_page.html";
}

// load history
let data = JSON.parse(localStorage.getItem("history")) || [];

let history = JSON.parse(localStorage.getItem("history")) || [];

let historyContainer = document.getElementById("historyList");


historyContainer.innerHTML = "";

history.reverse().forEach(item => {

    historyContainer.innerHTML += `
        <div style="border:1px solid #ccc; padding:15px; margin:10px; border-radius:10px;">
            
            <h3>${item.name || "Unnamed Resume"}</h3>
            <p>${item.time}</p>

            <button onclick="openResume(${item.id})">
                View
            </button>

            <button onclick="deleteResume(${item.id})">
                Delete
            </button>

        </div>
    `;
});




window.onpageshow = function(event) {
    if (event.persisted) {
        window.location.reload();
    }
};

// back button
function goBack(){
  window.location.href = "dashboard.html";
}

function openResume(id){

    let history = JSON.parse(localStorage.getItem("history")) || [];

    let selected = history.find(item => item.id === id);

    localStorage.setItem("resumeData", JSON.stringify(selected.data));

    window.location.href = selected.template;   
}

function deleteResume(id){

    let history = JSON.parse(localStorage.getItem("history")) || [];

    history = history.filter(item => item.id !== id);

    localStorage.setItem("history", JSON.stringify(history));

    location.reload();
}
</script>

</body>
</html>
