<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<title>Creative Resume</title>

<style>

/* A4 */
@page { size:A4; margin:0; }

body{
margin:0;
background:#ccc;
font-family:Arial;
font-size:13px;
}

.container{
width:210mm;
min-height:290mm;
margin:0 auto;
background:#fff;
display:flex;
overflow:hidden;
}

/* LEFT */
.left{
width:30%;
background:#0d1333;
color:white;
padding:15px;
box-sizing:border-box;
}

.photo{
width:100%;
height:160px;
background:#ccc;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.section{margin-top:20px;}
.section h3{border-bottom:1px solid #fff;margin-bottom:10px;}

.bar{height:4px;background:#555;}
.fill{height:4px;background:#fff;}

/* RIGHT */
.right{
width:70%;
padding:15px;
box-sizing:border-box;
overflow:hidden;
}

.item{display:flex;margin-bottom:10px;}
.dot{
width:8px;height:8px;background:#000;
border-radius:50%;
margin-right:8px;margin-top:6px;
}

.hide{display:none;}

</style>
</head>

<body>
<div id="pdfArea">
<div class="container">

<!-- LEFT -->
<div class="left">

<div class="photo">
<img id="rimage">
</div>

<h3 id="rname"></h3>

<div class="section hide" id="skillSection">
<h3>Skills</h3>
<div id="rskills"></div>
</div>

<div class="section hide" id="linkSection">
<h3>Links</h3>
<div id="rlinks"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="section hide" id="contactSection">
<p id="remail"></p>
<p id="rphone"></p>
<p id="raddress"></p>
</div>

<div class="section hide" id="projectSection">
<h3>Projects</h3>
<div id="rprojects"></div>
</div>

<div class="section hide" id="expSection">
<h3>Experience</h3>
<div id="rexperience"></div>
</div>

<div class="section hide" id="eduSection">
<h3>Education</h3>
<div id="reducation"></div>
</div>

<div class="section hide" id="certSection">
<h3>Certificates</h3>
<div id="rcert"></div>
</div>

<div class="section hide" id="customSection">
<div id="rcustom"></div>
</div>

</div>

</div>
</div>

<div style="text-align:center; margin:15px;">
  <button onclick="downloadResume()">Download PDF</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("resumeData"));

// ===== SAVE TO HISTORY =====
let history = JSON.parse(localStorage.getItem("history")) || [];

if(!sessionStorage.getItem("saved")){

    history.push({
        id: Date.now(),
        name: data.name || "Unnamed Resume",
        template: "templates code/creative4.html",
        data: data,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));

    sessionStorage.setItem("saved", "true");
}


if(data){

/* IMAGE */
if(data.image){
  document.getElementById("rimage").src = data.image;
}else{
  document.querySelector(".photo").style.display="none";
}

/* NAME */
setText("rname", data.name);

/* CONTACT */
let contactHTML="";
if(data.email) contactHTML += `<p>✉️ ${data.email}</p>`;
if(data.phone) contactHTML += `<p>📞 ${data.phone}</p>`;
if(data.address) contactHTML += `<p>📍 ${data.address}</p>`;

setHTML("contactSection", contactHTML);
toggle("contactSection", contactHTML);

/* LINKS */
let linkHTML="";
if(data.github) linkHTML += `<p>🔗 ${data.github}</p>`;
if(data.linkedin) linkHTML += `<p>💼 ${data.linkedin}</p>`;
if(data.hackerrank) linkHTML += `<p>🏆 ${data.hackerrank}</p>`;

setHTML("rlinks", linkHTML);
toggle("linkSection", linkHTML);

/* SKILLS */
let skillHTML="";
(data.skills || []).forEach(s=>{
  if(s.trim()!==""){
    skillHTML += `
    <p>${s}</p>
    <div class="bar"><div class="fill" style="width:80%"></div></div>`;
  }
});
setHTML("rskills", skillHTML);
toggle("skillSection", skillHTML);

/* PROJECTS */
let projHTML="";
(data.projects || []).forEach(p=>{
  if(p.title || p.desc){
    projHTML += `
    <div class="item">
      <div class="dot"></div>
      <div>
        <b>${p.title || ""}</b><br>${p.desc || ""}
      </div>
    </div>`;
  }
});
setHTML("rprojects", projHTML);
toggle("projectSection", projHTML);

/* EXPERIENCE */
let expHTML="";
(data.experience || []).forEach(e=>{
  if(e.role || e.company || e.desc){
    expHTML += `
    <div class="item">
      <div class="dot"></div>
      <div>
        <b>${e.role || ""}</b> ${e.company ? "- "+e.company : ""}<br>
        ${e.desc || ""}
      </div>
    </div>`;
  }
});
setHTML("rexperience", expHTML);
toggle("expSection", expHTML);

/* CERTIFICATES */
let certHTML="";
(data.certificates || []).forEach(c=>{
  if(c.name){
    certHTML += `<p>${c.name} ${c.org ? "- "+c.org : ""}</p>`;
  }
});
setHTML("rcert", certHTML);
toggle("certSection", certHTML);

/* EDUCATION 🔥 */
let edu = data.education || {};
let eduHTML="";

if(edu.school10 || edu.percent10){
  eduHTML += `<p><b>10th:</b> ${edu.school10 || ""} ${edu.percent10 ? "("+edu.percent10+"%)" : ""}</p>`;
}

if(edu.school12 || edu.percent12){
  eduHTML += `<p><b>12th:</b> ${edu.school12 || ""} ${edu.percent12 ? "("+edu.percent12+"%)" : ""}</p>`;
}

if(edu.boardUG || edu.percentUG){
  eduHTML += `<p><b>UG:</b> ${edu.boardUG || ""} ${edu.percentUG ? "("+edu.percentUG+")" : ""}</p>`;
}

if(edu.boardPG || edu.percentPG){
  eduHTML += `<p><b>PG:</b> ${edu.boardPG || ""} ${edu.percentPG ? "("+edu.percentPG+")" : ""}</p>`;
}

setHTML("reducation", eduHTML);
toggle("eduSection", eduHTML);

/* CUSTOM SECTIONS 🔥 */
let customHTML="";
(data.custom || []).forEach(c=>{
  if(c.heading && c.desc){
    customHTML += `
    <h3>${c.heading}</h3>
    <p>${c.desc}</p>`;
  }
});
setHTML("rcustom", customHTML);
toggle("customSection", customHTML);

}

/* HELPERS */
function setText(id,val){
  if(val && val.trim()!==""){
    document.getElementById(id).innerText=val;
    return true;
  }
  return false;
}

function setHTML(id,html){
  document.getElementById(id).innerHTML=html;
}

function toggle(id,cond){
  if(cond && cond.length !== 0){
    document.getElementById(id).classList.remove("hide");
  }
}
function downloadResume() {

    const element = document.getElementById("pdfArea");

    let opt = {
        margin: 0,
        filename: (document.getElementById("rname").innerText || "Resume") + ".pdf",

        html2canvas: {
            scale: 1.6,
            scrollY: 0
        },

        jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait'
        },

        pagebreak: {
            mode: ['avoid-all']
        }
    };

    html2pdf().set(opt).from(element).save();
}
</script>

</body>
</html>
