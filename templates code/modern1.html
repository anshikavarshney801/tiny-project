<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<title>Modern Resume</title>

<style>
body{
  margin:0;
  background:#ccc;
  font-family:Arial, sans-serif;
}

/* A4 BACK */
.resume{
  width:210mm;
  min-height:290mm;
  margin:0 auto;
  display:flex;
  background:white;
}

/* LEFT */
.left{
  width:35%;
  background:#2f3b46;
  color:white;
  padding:30px;
}

/* RIGHT */
.right{
  width:65%;
  padding:30px;
}

/* NAME */
.name{
  font-size:28px;
  font-weight:bold;
}

/* SECTION */
.section{
  margin-bottom:20px;
}

.section h2{
  font-size:16px;
  margin-bottom:10px;
}

/* IMAGE */
.profile-img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 20px;
}
</style>
</head>

<body>
  <div id="pdfArea">
<div class="resume">

  <!-- LEFT -->
  <div class="left">

    <img id="img" class="profile-img">

    <div class="section" id="contactSec">
      <h2>Contact</h2>
      <div id="contact"></div>
    </div>
    <div class="section" id="linkSec">
    <h2>Links</h2>
     <div id="links"></div>
    </div>

    <div class="section" id="skillSec">
      <h2>Skills</h2>
      <div id="skills"></div>
    </div>

    <div class="section" id="hobbySec">
      <h2>Hobbies</h2>
      <div id="hobbies"></div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="name"></div>

    <div class="section" id="profileSec">
      <h2>Profile</h2>
      <div id="profile"></div>
    </div>

    <div class="section" id="expSec">
      <h2>Work Experience</h2>
      <div id="exp"></div>
    </div>

    <div class="section" id="eduSec">
      <h2>Education</h2>
      <div id="edu"></div>
    </div>

    <div class="section" id="projSec">
      <h2>Projects</h2>
      <div id="proj"></div>
    </div>

    <div class="section" id="certSec">
      <h2>Certificates</h2>
      <div id="cert"></div>
    </div>

  </div>

</div>
</div>

<div style="text-align:center; margin:15px;">
  <button onclick="downloadResume()">Download PDF</button>
</div>

<script>
try{

const data = JSON.parse(localStorage.getItem("resumeData")) || {};
// ===== SAVE TO HISTORY =====
let history = JSON.parse(localStorage.getItem("history")) || [];

if(!sessionStorage.getItem("saved")){

    history.push({
        id: Date.now(),
        name: data.name || "Unnamed Resume",
        template: "templates code/modern1.html",
        data: data,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));

    sessionStorage.setItem("saved", "true");
}

// ===== NAME (STRONG FIX) =====
const nameEl = document.querySelector(".name");

// 🔥 force clean value
let nameValue = (data.name || "").trim();

// 🔥 fallback check (important)
if(nameValue.length > 0){
  nameEl.innerText = nameValue;
}else{
  // try alternative keys (just in case)
  nameEl.innerText = data.fullName || data.username || "";
}
// ===== IMAGE =====
const img = document.getElementById("img");
if(data.image){
  img.src = data.image;
}else{
  img.style.display="none";
}

// ===== CONTACT =====
let contact = "";
if(data.phone) contact += "📞 " + data.phone + "<br>";
if(data.email) contact += "✉️ " + data.email + "<br>";
if(data.address) contact += "📍 " + data.address;

if(contact){
  document.getElementById("contact").innerHTML = contact;
}else{
  document.getElementById("contactSec").style.display="none";
}

// ===== LINKS =====
const linkDiv = document.getElementById("links");
let linkHTML = "";

// GitHub
if(data.github && data.github.trim() !== ""){
  linkHTML += `<div><b>GitHub:</b> <a href="${data.github}" target="_blank">${data.github}</a></div>`;
}

// LinkedIn
if(data.linkedin && data.linkedin.trim() !== ""){
  linkHTML += `<div><b>LinkedIn:</b> <a href="${data.linkedin}" target="_blank">${data.linkedin}</a></div>`;
}

// HackerRank
if(data.hackerrank && data.hackerrank.trim() !== ""){
  linkHTML += `<div><b>HackerRank:</b> <a href="${data.hackerrank}" target="_blank">${data.hackerrank}</a></div>`;
}

// show / hide section
if(linkHTML){
  linkDiv.innerHTML = linkHTML;
}else{
  document.getElementById("linkSec").style.display = "none";
}

// ===== SKILLS =====
if(data.skills && data.skills.length){
  data.skills.forEach(s=>{
    document.getElementById("skills").innerHTML += `<div>${s}</div>`;
  });
}else{
  document.getElementById("skillSec").style.display="none";
}

// ===== HOBBIES =====
if(data.custom && data.custom.length){
  data.custom.forEach(h=>{
    document.getElementById("hobbies").innerHTML += `<div>${h.desc || ""}</div>`;
  });
}else{
  document.getElementById("hobbySec").style.display="none";
}

// ===== PROFILE =====
if(data.summary){
  document.getElementById("profile").innerText = data.summary;
}else{
  document.getElementById("profileSec").style.display="none";
}

// ===== EXPERIENCE =====
if(data.experience && data.experience.length){
  data.experience.forEach(e=>{
    document.getElementById("exp").innerHTML += `
      <div>
        <b>${e.role}</b><br>
        ${e.company}<br>
        ${e.desc}
      </div><br>
    `;
  });
}else{
  document.getElementById("expSec").style.display="none";
}

// ===== EDUCATION =====
let edu = data.education || {};
let eduHTML = "";

if(edu.school10 || edu.board10 || edu.percent10){
  eduHTML += `
    <div>
      <b>10th:</b> ${edu.school10 || ""}<br>
      ${edu.board10 ? "Board: " + edu.board10 + "<br>" : ""}
      ${edu.percent10 ? "Percentage: " + edu.percent10 + "%" : ""}
    </div><br>
  `;
}

if(edu.school12 || edu.board12 || edu.percent12){
  eduHTML += `
    <div>
      <b>12th:</b> ${edu.school12 || ""}<br>
      ${edu.board12 ? "Board: " + edu.board12 + "<br>" : ""}
      ${edu.percent12 ? "Percentage: " + edu.percent12 + "%" : ""}
    </div><br>
  `;
}

if(edu.boardUG || edu.percentUG){
  eduHTML += `
    <div>
      <b>UG:</b> ${edu.boardUG || ""}<br>
      ${edu.percentUG ? "CGPA/Percentage: " + edu.percentUG : ""}
    </div><br>
  `;
}

if(edu.boardPG || edu.percentPG){
  eduHTML += `
    <div>
      <b>PG:</b> ${edu.boardPG || ""}<br>
      ${edu.percentPG ? "CGPA/Percentage: " + edu.percentPG : ""}
    </div>
  `;
}

if(eduHTML){
  document.getElementById("edu").innerHTML = eduHTML;
}else{
  document.getElementById("eduSec").style.display="none";
}
// ===== PROJECTS =====
if(data.projects && data.projects.length){
  data.projects.forEach(p=>{
    document.getElementById("proj").innerHTML += `
      <div>
        <b>${p.title}</b><br>
        ${p.desc}
      </div><br>
    `;
  });
}else{
  document.getElementById("projSec").style.display="none";
}

// ===== CERTIFICATES =====
if(data.certificates && data.certificates.length){
  data.certificates.forEach(c=>{
    document.getElementById("cert").innerHTML += `
      <div>${c.name} - ${c.org}</div>
    `;
  });
}else{
  document.getElementById("certSec").style.display="none";
}

}catch(e){
  console.error(e);
}
function downloadResume() {

    const element = document.getElementById("pdfArea");

    let opt = {
        margin: 0,
        filename: (document.querySelector(".name").innerText || "Resume") + ".pdf",

        html2canvas: {
            scale: 1.6,
            scrollY: 0
        },

        jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait'
        },

        pagebreak: {
            mode: ['avoid-all']
        }
    };

    html2pdf().set(opt).from(element).save();
}

</script>

</body>
</html>
