<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
<title>Resume</title>

<style>
@page { size:A4; margin:0; }

body{
margin:0;
background:#ccc;
font-family:Arial;
font-size:13px;
}

.container{
width:210mm;
min-height:290mm;
margin:auto;
background:#fff;
display:flex;
overflow:hidden;
box-sizing: border-box;
}

.left{
width:35%;
background:#efefef;
padding:20px;
box-sizing:border-box;
}

.right{
width:65%;
padding:20px;
box-sizing:border-box;
overflow:hidden;
}

.header{text-align:center;}

.photo{
width:120px;
height:120px;
border-radius:50%;
overflow:hidden;
margin:auto;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.name{font-weight:bold;margin-top:10px;}
.title{color:#777;font-size:14px;}

.section{margin-top:20px;}
.section h3{
background:#e39b9b;
color:white;
padding:5px 10px;
font-size:14px;
margin:10px 0;
}

.item{margin-bottom:10px;}

.hide{display:none;}
</style>
</head>

<body>
<div id="pdfArea">
<div class="container">

<!-- LEFT -->
<div class="left">

<div class="header">
<div class="photo">
<img id="rimage">
</div>

<div class="name" id="rname"></div>
<div class="title" id="rtitle"></div>
</div>

<div class="section hide" id="contactSection">
<h3>CONTACTS</h3>
<div id="rcontact"></div>
</div>

<div class="section hide" id="objectiveSection">
<h3>OBJECTIVE</h3>
<p id="robjective"></p>
</div>

<div class="section hide" id="skillSection">
<h3>SKILLS</h3>
<div id="rskills"></div>
</div>

<div class="section hide" id="interestSection">
<h3>INTERESTS</h3>
<div id="rinterest"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="section hide" id="eduSection">
<h3>EDUCATION</h3>
<div id="reducation"></div>
</div>

<div class="section hide" id="workSection">
<h3>WORK EXPERIENCE</h3>
<div id="rwork"></div>
</div>

<div class="section hide" id="activitySection">
<h3>ACTIVITIES</h3>
<p id="ractivity"></p>
</div>

<div class="section hide" id="projectSection">
  <h3>PROJECTS</h3>
  <div id="rprojects"></div>
</div>

<div class="section hide" id="awardSection">
<h3>CERTIFICATES</h3>
<div id="raward"></div>
</div>
</div>
</div>
</div>

<div style="text-align:center; margin:15px;">
  <button onclick="downloadResume()">Download PDF</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("resumeData"));
let history = JSON.parse(localStorage.getItem("history")) || [];

if(!sessionStorage.getItem("saved")){

    history.push({
        id: Date.now(),
        name: data.name || "Unnamed Resume",
        template: "templates code/professional1.html",
        data: data,
        time: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));

    sessionStorage.setItem("saved", "true");
}

if(data){

/* IMAGE */
if(data.image){
document.getElementById("rimage").src = data.image;
}else{
document.querySelector(".photo").style.display="none";
}

/* NAME */
setText("rname", data.name);

/* TITLE */
setText("rtitle", data.title);

/* CONTACT + LINKS */
let contactHTML = "";

if(data.phone) contactHTML += `<p>📞 ${data.phone}</p>`;
if(data.email) contactHTML += `<p>✉️ ${data.email}</p>`;
if(data.address) contactHTML += `<p>📍 ${data.address}</p>`;

if(data.github) contactHTML += `<p>🔗 ${data.github}</p>`;
if(data.linkedin) contactHTML += `<p>💼 ${data.linkedin}</p>`;
if(data.hackerrank) contactHTML += `<p>🏆 ${data.hackerrank}</p>`;

setHTML("rcontact", contactHTML);
toggle("contactSection", contactHTML);

/* 🔥 CUSTOM SECTION 0 */
if(data.custom && data.custom[0]){
let h = data.custom[0].heading || "OBJECTIVE";
let d = data.custom[0].desc || "";

document.querySelector("#objectiveSection h3").innerText = h;
setText("robjective", d);
toggle("objectiveSection", d);
}

/* SKILLS */
let skillHTML="";
(data.skills || []).forEach(s=>{
if(s.trim()!==""){
skillHTML += `<p>${s}</p>`;
}
});
setHTML("rskills", skillHTML);
toggle("skillSection", skillHTML);

/* 🔥 CUSTOM SECTION 1 */
if(data.custom && data.custom[1]){
let h = data.custom[1].heading || "INTERESTS";
let d = data.custom[1].desc || "";

document.querySelector("#interestSection h3").innerText = h;
setText("rinterest", d);
toggle("interestSection", d);
}

/* EDUCATION */
let edu = data.education || {};
let eduHTML="";

if(edu.school10 || edu.percent10){
eduHTML += `<div class="item"><b>10th:</b> ${edu.school10 || ""} ${edu.percent10 ? "("+edu.percent10+"%)" : ""}</div>`;
}

if(edu.school12 || edu.percent12){
eduHTML += `<div class="item"><b>12th:</b> ${edu.school12 || ""} ${edu.percent12 ? "("+edu.percent12+"%)" : ""}</div>`;
}

if(edu.boardUG || edu.percentUG){
eduHTML += `<div class="item"><b>UG:</b> ${edu.boardUG || ""} ${edu.percentUG ? "("+edu.percentUG+")" : ""}</div>`;
}

if(edu.boardPG || edu.percentPG){
eduHTML += `<div class="item"><b>PG:</b> ${edu.boardPG || ""} ${edu.percentPG ? "("+edu.percentPG+")" : ""}</div>`;
}

setHTML("reducation", eduHTML);
toggle("eduSection", eduHTML);

/* WORK */
let workHTML="";
(data.experience || []).forEach(e=>{
if(e.role || e.company || e.desc){
workHTML += `
<div class="item">
<b>${e.role || ""}</b> ${e.company ? "- "+e.company : ""}<br>
${e.desc || ""}
</div>`;
}
});
setHTML("rwork", workHTML);
toggle("workSection", workHTML);

/* 🔥 CUSTOM SECTION 2 */
if(data.custom && data.custom[2]){
let h = data.custom[2].heading || "ACTIVITIES";
let d = data.custom[2].desc || "";

document.querySelector("#activitySection h3").innerText = h;
setText("ractivity", d);
toggle("activitySection", d);
}

/*PROJECT */
let projectHTML = "";

(data.projects || []).forEach(p=>{
  if(p.title || p.desc){
    projectHTML += `
    <div class="item">
      <b>${p.title || ""}</b><br>
      ${p.desc || ""}
    </div>`;
  }
});

setHTML("rprojects", projectHTML);
toggle("projectSection", projectHTML);

/* AWARDS */
let awardHTML="";
(data.certificates || []).forEach(c=>{
if(c.name){
awardHTML += `<p>${c.name} ${c.org ? "- "+c.org : ""}</p>`;
}
});
setHTML("raward", awardHTML);
toggle("awardSection", awardHTML);

/* 🔥 CUSTOM SECTION 3 */
if(data.custom && data.custom[3]){
let h = data.custom[3].heading || "REFERENCES";
let d = data.custom[3].desc || "";

document.querySelector("#refSection h3").innerText = h;
setText("rref", d);
toggle("refSection", d);
}

}

/* HELPERS */
function setText(id,val){
if(val && val.trim()!==""){
document.getElementById(id).innerText = val;
return true;
}
return false;
}

function setHTML(id,html){
document.getElementById(id).innerHTML = html;
}

function toggle(id,cond){
if(cond && cond.length !== 0){
document.getElementById(id).classList.remove("hide");
}
}
function downloadResume() {

    const element = document.getElementById("pdfArea");

    let opt = {
        margin: 0,
        filename: (document.querySelector(".name").innerText || "Resume") + ".pdf",

        html2canvas: {
            scale: 1.6,
            scrollY: 0
        },

        jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait'
        },

        pagebreak: {
            mode: ['avoid-all']
        }
    };

    html2pdf().set(opt).from(element).save();
}

</script>

</body>
</html>
